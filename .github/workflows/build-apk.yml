name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/ScanPhieuKho-v39.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanPhieuKho-Android-APK
          path: build-output/ScanPhieuKho-v39.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v39.0.0
          name: "Scan Phiếu Kho Android APK - V2 UI (v39.0.0)"
          body: |
            ## 📱 Ứng Dụng Scan Phiếu Kho Android (.APK) - Phiên bản V2
            - **Phiên bản**: v39.0.0
            - **Áp dụng Giao diện V2**: Mặc định khởi động vào Giao diện V2 tối giản (chuẩn thiết kế phẳng, viền 1px mỏng, typography sắc nét).
            - **Chuyển đổi giao diện linh hoạt**: Hỗ trợ nút chuyển đổi qua lại giữa Giao diện V2 mới và Giao diện V1 gốc trực tiếp ngay trên thanh tiêu đề ứng dụng.
            - **Đa mô hình AI**: Hỗ trợ Google Gemini 3.6/3.7/3.8 Flash và Custom API OpenAI-Compatible.
            
            👉 Tải file cài đặt: `ScanPhieuKho-v39.apk`
          files: build-output/ScanPhieuKho-v39.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
