name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/ScanPhieuKho-v38.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanPhieuKho-Android-APK
          path: build-output/ScanPhieuKho-v38.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v38.0.0
          name: "Scan Phiếu Pro Max Android APK (v38.0.0)"
          body: |
            ## 📱 Ứng Dụng Scan Phiếu Kho Android (.APK)
            - **Phiên bản**: v38.0.0
            - **Tối ưu tốc độ AI**: Google Gemini 3.6 Flash tự động nén ảnh trên canvas, giảm 70% input token và tăng tốc upload gấp 10 lần.
            - **Bộ giải mã JSON siêu cấp**: Tự động vá lỗi thiếu ngoặc `]}`, unescaped quotes và regex fallback - triệt tiêu hoàn toàn lỗi gộp dòng.
            - **Đồng bộ Google Sheet**: Tự động chèn dòng trống phân cách hoàn hảo giữa các phiếu/trang khi quét hàng loạt.
            - **OpenRouter Mới**: Tích hợp thêm 2 model siêu chuẩn & miễn phí `Nex-N2.5-Pro (Free)` và `Nex-N2.5-Mini (Free)`.
            
            👉 Tải file cài đặt: `ScanPhieuKho-v38.apk`
          files: build-output/ScanPhieuKho-v38.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
