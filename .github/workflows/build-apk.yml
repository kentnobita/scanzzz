name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Platform 35
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/ScanPhieuKho-v36.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanPhieuKho-Android-APK
          path: build-output/ScanPhieuKho-v36.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v36.0.18
          name: "Scan Phiếu Pro Max Android APK (v36.0.18)"
          body: |
            ## 📱 Ứng Dụng Scan Phiếu Kho Android (.APK)
            - **Phiên bản**: `v36.0.18`
            - **Hệ điều hành hỗ trợ**: Android 7.0+
            - **Tính năng**: Tự động chụp cắt viền phiếu, bật đèn Flash, đồng bộ Cloud và Google Sheet thời gian thực.
            
            👉 **Tải file cài đặt bên dưới**: `ScanPhieuKho-v36.apk`
          files: build-output/ScanPhieuKho-v36.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
