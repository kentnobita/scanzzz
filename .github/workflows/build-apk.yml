name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/ScanPhieuKho-v36.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanPhieuKho-Android-APK
          path: build-output/ScanPhieuKho-v36.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v36.0.18
          name: "Scan Phiếu Pro Max Android APK (v36.0.18)"
          body: |
            ## 📱 Ứng Dụng Scan Phiếu Kho Android (.APK)
            - **Phiên bản**: v36.0.18
            - **Hệ điều hành**: Android 5.1+
            - **Tính năng**: Camera quét phiếu tự động, đèn Flash, đồng bộ Cloud & Google Sheet.
            
            👉 Tải file cài đặt: `ScanPhieuKho-v36.apk`
          files: build-output/ScanPhieuKho-v36.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
